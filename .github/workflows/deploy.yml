name: deploy
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "deploy/**"
      - "Dockerfile"
      - "prompt.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# One deploy at a time — the RWO PVC and host :443 have single owners.
concurrency:
  group: deploy-social-update
  cancel-in-progress: false

jobs:
  tests:
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v4
    with:
      runner: arc-df-social-update

  # Separate job because a called workflow may not request more GITHUB_TOKEN
  # permission than the calling job grants, and `permissions:` accepts no
  # expressions -- so the build's `packages: write` cannot be made conditional
  # inside deploy-k8s.yml without every non-building caller failing validation.
  #
  # image-repo and image-tag stay empty: build-push-image derives
  # ghcr.io/<owner>/<repo>:<sha> lowercased, identical to what the old inline
  # "Compute image tag" step produced.
  build:
    needs: tests
    permissions:
      contents: read
      packages: write
    uses: dustfeather/shared-workflows/.github/workflows/build-push-image.yml@v4
    with:
      runner: arc-df-social-update

  deploy:
    needs: build
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-k8s.yml@v4
    with:
      runner: arc-df-social-update
      namespace: social-update
      image: ${{ needs.build.outputs.image }}
      # setup-kubectl deliberately omitted (defaults false): the
      # arc-df-social-update image already carries kubectl, which is why the
      # previous inline job called it with no install step. deploy-k8s.yml
      # verifies kubectl is present and fails loudly if that ever stops holding.
      #
      # Namespace is pre-created by the admin-applied deploy/ci-rbac.yaml and the
      # runner SA can only `get` it, so `get` keeps a missing namespace as a
      # clear error rather than an RBAC denial. deploy/namespace.yaml and
      # deploy/ci-rbac.yaml stay admin-owned and are not applied here.
      ensure-namespace: get
      # Replaces the inline `kubectl create secret --from-literal | apply`.
      # Keys come from the SECRET_LITERALS secret as KEY=VALUE lines; the
      # workflow applies it before any manifest, matching the old step order.
      secret-name: social-update-secrets
      # deploy/tls-proxy.yaml is deliberately NOT applied. The ingress/edge-proxy
      # absorbed this service's vhost on 2026-08-08 and the per-namespace proxy
      # Deployment was deleted then. It stayed in this list, and because the repo
      # had not deployed since 2026-06-21, the first run after that deletion
      # resurrected it as a pod that can never schedule -- edge-proxy owns
      # hostPort 443 on acer-laptop, and the only other node carries an
      # untolerated taint.
      #
      # That zombie is not inert: it is a permanently queued claimant on :443.
      # edge-proxy is strategy: Recreate, so on its next roll the port frees for
      # a moment and the scheduler can award it to the zombie instead, leaving
      # edge-proxy Pending and dropping every vhost it fronts. Keeping this file
      # out of CI is what prevents that.
      manifests: |
        deploy/pvc.yaml
        deploy/certificate.yaml
        deploy/service.yaml
      # envsubst-vars defaults to $IMAGE, the only variable this manifest uses.
      templated-manifests: deploy/deployment.yaml
      # deployment.yaml reads the token via secretKeyRef, i.e. as an env var,
      # and env vars are injected at container start and never refreshed. So
      # rotating the token and re-deploying the same commit would otherwise
      # change nothing the pod can see: identical pod template, apply is a
      # no-op, no rollout, old token still served. Restarting here forces the
      # new Secret to be read, and runs before the rollout wait so that
      # `rollout status` below blocks on this restart rather than racing it.
      post-apply-command: kubectl rollout restart deployment/social-update
      rollout-targets: deployment/social-update
      rollout-timeout: 180s
      show-command: kubectl get pods,svc,certificate
    # Composed here rather than stored as its own secret: the token already
    # exists as a repo secret, and secret values are write-only, so a separate
    # SECRET_LITERALS secret would mean re-sourcing the token by hand and then
    # having two copies of one credential to rotate. The block scalar matters --
    # deploy-k8s.yml parses this line-by-line, one KEY=VALUE per line.
    secrets:
      SECRET_LITERALS: |
        CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: PR checks
on:
  pull_request:
    # `closed` is in this list to cancel this workflow's own in-flight run when
    # the PR merges. A merge fires no `synchronize`, so without it nothing ever
    # re-enters the concurrency group below, and the review job keeps a
    # self-hosted runner busy on a commit that is already history. Every job is
    # gated off `closed`, so the run this creates does no work: it exists only
    # to claim the group and cancel its predecessor.
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Supersede an in-flight run when the PR is pushed to again, and — through
# the `closed` trigger above — when it merges. This repo had no concurrency
# group at all, so a merged PR's review job went on holding the single
# `arc-df-social-update` runner while the next job queued behind it.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Skipped on `closed` — see the `types:` note above.
    if: github.event.action != 'closed'
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v4
    with:
      node-version: "26"
      run-build: true          # `npm run build` (tsc); lint/test/typecheck auto-skip (no such scripts)
      runner: arc-df-social-update
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  web:
    # Skipped on `closed` — see the `types:` note above.
    if: github.event.action != 'closed'
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v4
    with:
      node-version: "26"
      working-dir: web
      run-build: true          # `tsc --noEmit && vite build`
      runner: arc-df-social-update
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  review:
    if: github.event.action != 'closed'
    needs: [tests, web]
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: dustfeather/shared-workflows/.github/workflows/claude-code-review.yml@v4
    with:
      runner: arc-df-social-update
    secrets: inherit

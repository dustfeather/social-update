name: PR checks
on:
  pull_request:
    # `closed` is in this list to cancel this workflow's own in-flight run when
    # the PR merges. A merge fires no `synchronize`, so without it nothing ever
    # re-enters the concurrency group below, and the review job keeps a
    # runner busy on a commit that is already history. Every job is
    # gated off `closed`, so the run this creates does no work: it exists only
    # to claim the group and cancel its predecessor.
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Supersede an in-flight run when the PR is pushed to again, and — through
# the `closed` trigger above — when it merges. This repo had no concurrency
# group at all, so a merged PR's review job went on holding the single
# runner this repo's pool had, while the next job queued behind it.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Skipped on `closed` — see the `types:` note above.
    if: github.event.action != 'closed'
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v8
    with:
      node-version: "26"
      run-build: true          # `npm run build` (tsc); lint/test/typecheck auto-skip (no such scripts)
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  web:
    # Skipped on `closed` — see the `types:` note above.
    if: github.event.action != 'closed'
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v8
    with:
      node-version: "26"
      working-dir: web
      run-build: true          # `tsc --noEmit && vite build`
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Build the image without publishing it. Until this job existed, nothing
  # exercised the Dockerfile on a PR: the only build was in deploy.yml, which runs
  # after the merge, so a broken base image or a bad Dockerfile line reached `main`
  # and was discovered by the job that deploys it.
  #
  # `packages: write` is granted even though nothing is pushed, and that is
  # required rather than sloppy: build-push-image.yml's build job requests it
  # unconditionally (`permissions:` accepts no expressions, so it cannot ask only
  # when it is publishing), and a called workflow may not request more than the
  # calling job grants -- granting less fails at validation with
  # `startup_failure` and zero jobs, which reports nothing useful.
  #
  # `push: false` also turns the registry build cache read-only for this job, so a
  # PR cannot write the `:buildcache` tag that deploy.yml's build pulls from.
  # cache-from still applies, which is what keeps this fast enough to gate on.
  image:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: dustfeather/shared-workflows/.github/workflows/build-push-image.yml@v8
    with:
      push: false

  review:
    if: github.event.action != 'closed'
    needs: [tests, web]
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: dustfeather/shared-workflows/.github/workflows/claude-code-review.yml@v8
    secrets: inherit

version: 2

# Until this file existed the repo had security updates only: Dependabot opened
# a PR when an advisory was published against something in a lockfile, and
# nothing otherwise. That is why the only Dependabot PRs this repo has ever seen
# are named `npm_and_yarn in /web for postcss - Update #<id>` -- the `for <pkg>`
# suffix is the security-update job shape. Routine drift was never scanned.
#
# Majors are deliberately NOT ignored here, unlike in shared-workflows. That
# repo re-points a floating v4 tag on every push, so a merged major reaches
# every consumer with no gate; this is a leaf repo where a merge ships nothing
# on its own, so a major PR is just a prompt to read a changelog.

updates:
  # Two npm manifests: the service at the root and the Vite frontend in /web.
  # They have separate lockfiles, so a bump in one never conflicts with the
  # other -- no consolidation needed across the two directories.
  #
  # Within /web it is a different story. react/react-dom and their @types are
  # peer-locked to each other, and an ungrouped major produces one PR per
  # "multi" update group: @types/react-dom@19 peer-requires @types/react@^19.2,
  # while @types/react-dom@18 peer-requires @types/react@^18. So each PR fails
  # `npm ci` with ERESOLVE on its own, and neither merge order leaves main
  # installable in between. The react group below has no update-types filter on
  # purpose -- majors are exactly the case that must arrive as one PR. It is
  # listed first because a dependency joins the FIRST group it matches, which
  # keeps react minors out of npm-minor-patch and in one place.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Dependabot tracks the newest tag matching the shape of the current one
    # and has no idea what LTS means, so it will happily offer node 25 -- an
    # odd major, which never enters LTS and reaches end of life with no
    # maintenance window. This Dockerfile is the production runtime, not just a
    # builder, so only even majors are wanted here. Drop an entry from this list
    # when its major turns out to be the one to move to.
    ignore:
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]

  # Every `uses:` in this repo now points at dustfeather/shared-workflows, so
  # this block exists to catch that pin going to a new major. The pin is a bare
  # floating major (@v4), which every v4.x release already satisfies, so a major
  # is the only update it can ever produce -- which is exactly the one worth
  # being told about.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
